name: Refresh marine bulletin

# Environment Canada reissues the marine forecast a few times a day, plus
# amendments and warnings whenever they happen. Hourly keeps the stored copy
# close enough without hammering their server.
#
# GitHub's scheduler is best-effort on free repos and can run late when it is
# busy. The page shows how old the stored copy is, so lateness is visible
# rather than silent.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A belt-and-braces cap. The script stops itself after three minutes, so
    # if the job is still going at five something is wrong and it should die
    # rather than sit there burning minutes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the bulletin
        run: python scripts/fetch_bulletin.py

      - name: Commit if anything changed
        run: |
          git config user.name  github-actions
          git config user.email actions@github.com
          git add data/bulletin.json
          # No change is the normal case between issue times, and an empty
          # commit would just add noise to the history.
          git diff --staged --quiet || git commit -m "marine bulletin $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
