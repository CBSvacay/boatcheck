name: Refresh marine bulletin

# Environment Canada reissues the marine forecast a few times a day, plus
# amendments and warnings whenever they happen. Hourly keeps the stored copy
# close enough without hammering their server.
#
# GitHub's scheduler is best-effort on free repos and can run late when it is
# busy. The page shows how old the stored copy is, so lateness is visible
# rather than silent.
on:
  schedule:
    # Every 20 minutes rather than hourly. Scheduled jobs on GitHub are
    # best-effort and get delayed when the service is busy, which was leaving
    # the measured wind a couple of hours behind. Three chances an hour means a
    # skipped run barely shows. Nothing is committed when nothing has changed.
    - cron: "*/20 * * * *"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A belt-and-braces cap. The script stops itself after three minutes, so
    # if the job is still going at five something is wrong and it should die
    # rather than sit there burning minutes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the bulletin
        run: python scripts/fetch_bulletin.py

      - name: Commit if anything changed
        run: |
          git config user.name  github-actions
          git config user.email actions@github.com
          git add data/bulletin.json
          # No change is the normal case between issue times, and an empty
          # commit would just add noise to the history.
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "marine bulletin $(date -u +%Y-%m-%dT%H:%MZ)"
          # Anything committed while this job was running — a scheduled run,
          # or an edit in the browser — leaves this push rejected. Rebase on
          # top and retry rather than failing the job. Only data/bulletin.json
          # is ever touched here, so there is nothing to conflict with.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing and retrying ($i)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "could not push after three attempts" >&2
          exit 1
